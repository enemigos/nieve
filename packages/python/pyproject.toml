[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dud-cl-rut"
version = "0.4.0"
description = "Lean Chilean RUT validation and formatting for Python"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "dud-cl" }]
keywords = ["rut", "chile", "validate", "format"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/panquequelol/rut-cl"
Repository = "https://github.com/panquequelol/rut-cl"
Issues = "https://github.com/panquequelol/rut-cl/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.14", "ruff>=0.9"]

[tool.hatch.build.targets.sdist]
include = ["src/dud_cl/rut", "README.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/dud_cl"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "A", "RUF"]
# `input` and `format` shadow builtins on purpose: the public API mirrors the
# TypeScript package, where `format` and the `input` issue field are the names
# users already know.
ignore = ["A001", "A002", "A004"]

[tool.ruff.format]
# Documentation code blocks use aligned trailing comments on purpose.
exclude = ["*.md"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
packages = ["dud_cl.rut", "tests"]
