# Applies to the maintenance scripts in scripts/. The published Python package
# is configured in packages/python/pyproject.toml.
line-length = 88
target-version = "py310"

[lint]
select = ["E", "F", "I", "UP", "B", "A", "RUF"]

[format]
# Documentation code blocks use aligned trailing comments on purpose.
exclude = ["*.md"]
